<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Packages</title>
  </head>
  <body>
    <h1>Packages</h1>
    <a href="index.html">Dashboard</a>
    <pre id="packages">Loading...</pre>
    <script>
      fetch("/packages/")
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("packages").textContent = JSON.stringify(data, null, 2);
        });
    </script>
  </body>
</html>
